                  A20000000000000000000002 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  A20000000000000000000003 /* R34VaultiOS.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = R34VaultiOS.app; sourceTree = BUILT_PRODUCTS_DIR; };
          /* End PBXFileReference section */

          /* Begin PBXFrameworksBuildPhase section */
                  A30000000000000000000001 /* Frameworks */ = {
                      isa = PBXFrameworksBuildPhase;
                      buildActionMask = 2147483647;
                      files = (
