          plutil -lint R34VaultiOS/Info.plist
          xcodebuild -project R34VaultiOS.xcodeproj -list

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$PWD/build/Release-iphoneos"
          rm -rf "$PWD/build"

          xcodebuild \
            -project R34VaultiOS.xcodeproj \
            -target R34VaultiOS \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            clean build

          APP="$BUILD_DIR/R34VaultiOS.app"
          test -d "$APP"
          test -f "$APP/R34VaultiOS"
          test -f "$APP/Info.plist"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload R34Vault-iOS-unsigned.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/R34VaultiOS.app Payload/
          /usr/bin/zip -qry R34Vault-iOS-unsigned.ipa Payload

          unzip -l R34Vault-iOS-unsigned.ipa | grep "Payload/R34VaultiOS.app/R34VaultiOS"
          ls -lh R34Vault-iOS-unsigned.ipa
          shasum -a 256 R34Vault-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: R34Vault-iOS-unsigned-IPA
          path: R34Vault-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
