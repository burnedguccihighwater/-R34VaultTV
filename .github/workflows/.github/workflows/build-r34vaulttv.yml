      # ------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "APK was not created"

            exit 1

          fi

          echo "APK successfully created:"
          ls -lh "$APK"

